services:
  app:
    image: "docker.io/twinproduction/gatus@sha256:215787ef82f7bd16c3b8e9055630b66f938914c8ff764ef9508e7d1d4d550bf0"
    x-zenith-image:
      source: "twinproduction/gatus:latest"
      last_pin: "docker.io/twinproduction/gatus@sha256:215787ef82f7bd16c3b8e9055630b66f938914c8ff764ef9508e7d1d4d550bf0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATUS_CONFIG_PATH: /config
    volumes:
      - config:/config
      - data:/data

volumes:
  config:
  data:

x-zenith:
  catalog:
    name: Gatus
    description: Status page and health monitoring for services.
    authors: [TwiN]
    tags: [monitoring, status-page]
    source: https://github.com/TwiN/gatus
    license: MIT
  expose:
    - service: app
      port: 8080
      web: true
  storage:
    config:
      volume: config
      label: Configuration
      description: Gatus configuration files.
      public: false
    data:
      volume: data
      label: Application data
      description: Persistent Gatus storage data.
      public: false
